name: Update Gemini CLI Version

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# The pull request is created and merged with the token of the update GitHub
# App, so the workflow token only reads the repository.
permissions:
  contents: read

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Nix
        uses: cachix/install-nix-action@v31.11.5
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Check for updates
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "current=$(sed -n 's/.*version = "\([^"]*\)".*/\1/p' package.nix | head -1)" >> "$GITHUB_OUTPUT"

          status=0
          ./scripts/update-version.sh --check || status=$?
          # The script reserves 2 for an available update; any other failure
          # must fail this step instead of starting an update.
          case "$status" in
            0) echo "update_needed=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "update_needed=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Update version and hash
        id: update
        if: steps.check.outputs.update_needed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/update-version.sh
          echo "version=$(sed -n 's/.*version = "\([^"]*\)".*/\1/p' package.nix | head -1)" >> "$GITHUB_OUTPUT"

      # GitHub holds the pull request checks for approval when the workflow token
      # creates the pull request. A GitHub App token starts them without approval.
      # The token is created after the update step, which builds and runs upstream
      # code, so that code runs while the job holds only read access.
      - name: Create update App token
        if: steps.check.outputs.update_needed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPDATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request
        if: steps.check.outputs.update_needed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: update gemini-cli to version ${{ steps.update.outputs.version }}"
          title: "chore: update gemini-cli to version ${{ steps.update.outputs.version }}"
          body: |
            ## Automated Gemini CLI Update

            This PR updates Gemini CLI from version `${{ steps.check.outputs.current }}` to `${{ steps.update.outputs.version }}`.

            ### Changes
            - Updated `version` in `package.nix`
            - Updated the upstream source hash in `package.nix`
            - Updated `npmDepsHash` from the upstream lockfile
            - Updated `flake.lock`

            ### Verification
            - Version number updated in `package.nix`
            - Source and dependency hashes automatically calculated from the upstream source tarball and npm lockfile
            - Build and runtime verified before PR creation
            - Build verified during CI
            - All changes automated via update script

            ---

            To test this update locally:
            ```bash
            nix build
            ./result/bin/gemini --version
            ```

            This PR was automatically generated by the update workflow.
          branch: update-gemini-cli-${{ steps.update.outputs.version }}
          delete-branch: true
          labels: |
            dependencies
            automated

      # The required status checks on main hold the merge until both builds pass.
      # GitHub deletes the branch after the merge, because the GitHub CLI does not
      # delete it when the merge is deferred.
      - name: Enable Auto-Merge
        if: steps.check.outputs.update_needed == 'true' && steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PULL_REQUEST_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: gh pr merge "$PULL_REQUEST_NUMBER" --auto --squash

      - name: Summary
        if: always()
        env:
          UPDATE_NEEDED: ${{ steps.check.outputs.update_needed }}
          CURRENT_VERSION: ${{ steps.check.outputs.current }}
          UPDATED_VERSION: ${{ steps.update.outputs.version }}
          PULL_REQUEST_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          {
            echo "## Update Summary"
            echo ""
            echo "- **Current Version:** $CURRENT_VERSION"
            if [ -n "$UPDATED_VERSION" ]; then
              echo "- **Latest Version:** $UPDATED_VERSION"
            fi
            if [ -n "$PULL_REQUEST_NUMBER" ]; then
              echo "- **Pull Request:** #$PULL_REQUEST_NUMBER"
              echo ""
              echo "Pull request created for version update!"
            elif [ "$UPDATE_NEEDED" == "true" ]; then
              echo ""
              echo "Update detected, but the workflow failed before creating a pull request."
            elif [ "$UPDATE_NEEDED" == "false" ]; then
              echo ""
              echo "Already up to date!"
            else
              echo ""
              echo "The check for a new version failed. The log of the \"Check for updates\" step shows the reason."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
