name: Publish to Flakestry

on:
  push:
    tags:
      - 'v?.?.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v0.25.1)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Publish to Flakestry
        uses: flakestry/flakestry-publish@main
        with:
          version: ${{ inputs.tag || github.ref_name }}
