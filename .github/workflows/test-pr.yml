name: Test PR

on:
  pull_request:
    paths:
      - 'package.nix'
      - 'flake.nix'
      - 'flake.lock'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm64, macos-latest, macos-13]
        package: [gemini-cli, gemini-cli-node, gemini-cli-bun]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.package }}
        run: nix build .#${{ matrix.package }}

      - name: Verify binary exists
        run: |
          case "${{ matrix.package }}" in
            gemini-cli)
              test -x ./result/bin/gemini
              test -x ./result/bin/gemini-raw
              ;;
            gemini-cli-node)
              test -x ./result/bin/gemini-node
              test -f ./result/lib/gemini.js
              ;;
            gemini-cli-bun)
              test -x ./result/bin/gemini-bun
              test -f ./result/lib/gemini.js
              ;;
          esac

      - name: Test version output
        run: |
          case "${{ matrix.package }}" in
            gemini-cli)
              ./result/bin/gemini --version | grep -E '^[0-9]+\.[0-9]+\.[0-9]+'
              ;;
            gemini-cli-node)
              ./result/bin/gemini-node --version | grep -E '^[0-9]+\.[0-9]+\.[0-9]+'
              ;;
            gemini-cli-bun)
              ./result/bin/gemini-bun --version | grep -E '^[0-9]+\.[0-9]+\.[0-9]+'
              ;;
          esac
