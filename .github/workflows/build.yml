name: "Build and Cache"
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Gemini CLI Version"]
    types:
      - completed
    branches: [ main ]

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        variant: [gemini-cli, gemini-cli-bun]
    steps:
    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      env:
        NIX_FIRST_BUILD_UID: 400

    - uses: cachix/cachix-action@v15
      if: github.ref == 'refs/heads/main'
      with:
        name: gemini-cli-nix
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

    - name: Build ${{ matrix.variant }}
      run: |
        nix build .#${{ matrix.variant }}

    - name: Push to Cachix
      if: github.ref == 'refs/heads/main'
      run: |
        nix build .#${{ matrix.variant }} --json | jq -r '.[].outputs.out' | cachix push gemini-cli-nix

    - name: Test ${{ matrix.variant }}
      run: |
        if [ "${{ matrix.variant }}" = "gemini-cli-bun" ]; then
          ./result/bin/gemini-bun --version
        else
          ./result/bin/gemini --version
        fi
