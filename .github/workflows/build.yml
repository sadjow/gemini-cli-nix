name: "Build and Cache"
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Gemini CLI Version"]
    types:
      - completed
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      env:
        NIX_FIRST_BUILD_UID: 400

    - uses: cachix/cachix-action@v15
      if: github.ref == 'refs/heads/main'
      with:
        name: gemini-cli-nix
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

    - name: Build all variants
      run: |
        echo "Building gemini-cli..."
        nix build .#gemini-cli -o result-node
        echo "Building gemini-cli-native..."
        nix build .#gemini-cli-native -o result-native
        echo "Building gemini-cli-bun..."
        nix build .#gemini-cli-bun -o result-bun

    - name: Push to Cachix
      if: github.ref == 'refs/heads/main'
      run: |
        echo "Pushing gemini-cli..."
        nix build .#gemini-cli --json | jq -r '.[].outputs.out' | cachix push gemini-cli-nix
        echo "Pushing gemini-cli-native..."
        nix build .#gemini-cli-native --json | jq -r '.[].outputs.out' | cachix push gemini-cli-nix
        echo "Pushing gemini-cli-bun..."
        nix build .#gemini-cli-bun --json | jq -r '.[].outputs.out' | cachix push gemini-cli-nix

    - name: Test all variants
      run: |
        echo "Testing gemini-cli..."
        ./result-node/bin/gemini --version
        echo "Testing gemini-cli-native..."
        ./result-native/bin/gemini --version
        echo "Testing gemini-cli-bun..."
        ./result-bun/bin/gemini-bun --version
